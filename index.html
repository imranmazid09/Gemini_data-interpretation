<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Imran Mazid's Insight Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
        }
        .main-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: 100vh;
        }
        .sidebar {
            background: linear-gradient(180deg, #1e3a8a 0%, #1c3d91 100%);
            color: white;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }
        .content-area {
            padding: 3rem;
            overflow-y: auto;
            background-color: #ffffff;
        }
        .stage-item {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            opacity: 0.5;
            transition: all 0.3s ease;
            cursor: default;
        }
        .stage-item.active {
            opacity: 1;
            font-weight: 700;
        }
        .stage-item.completed {
            opacity: 0.8;
            cursor: pointer;
        }
        .stage-number {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            transition: all 0.3s ease;
        }
        .stage-item.active .stage-number {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .stage-item.completed .stage-number {
            background-color: #16a34a;
            border-color: #16a34a;
        }
        .ai-helper {
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 1.5rem;
        }
        .chat-box {
            height: 150px;
            overflow-y: auto;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        .chat-message {
            margin-bottom: 0.5rem;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
        }
        .user-message {
            background-color: #3b82f6;
            text-align: right;
            margin-left: 2rem;
        }
        .ai-message {
            background-color: #2b4f9a;
            margin-right: 2rem;
        }
        .drop-zone {
            border: 2px dashed #d1d5db;
            border-radius: 0.75rem;
            padding: 2.5rem;
            text-align: center;
            transition: all 0.3s ease;
            background-color: #f9fafb;
        }
        .drop-zone.dragover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        .btn-primary {
            background: linear-gradient(to right, #3b82f6, #60a5fa);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.2);
            border: none;
            cursor: pointer;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 7px 10px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-secondary {
            background-color: #e5e7eb;
            color: #374151;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: background-color 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn-secondary:hover:not(:disabled) {
            background-color: #d1d5db;
        }
        .btn-secondary:disabled {
             background-color: #e5e7eb;
             opacity: 0.5;
             cursor: not-allowed;
        }
        .privacy-banner {
            background-color: #eff6ff;
            border-left: 4px solid #3b82f6;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 0.5rem;
        }
        .privacy-banner p {
            font-size: 0.875rem;
            color: #1e40af;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="flex items-center mb-12">
                 <div class="p-2 bg-white rounded-lg mr-4">
                    <svg class="w-8 h-8 text-[#1e3a8a]" viewBox="0 0 24 24" fill="currentColor"><path d="M12.38 2.52a1 1 0 00-1.1-1.48C5.23 2.56 2 7.51 2 12a1 1 0 002 0c0-3.53 2.5-7.05 7.82-8.35a1 1 0 00.56-1.13zm8.24 10.53a1 1 0 00-1-1.73c-4.43-1.48-6.93-5.22-7.86-8.2a1 1 0 00-1.88.66c1.01 3.28 3.89 7.72 9.2 9.38a1 1 0 001.54-1.1zM11.62 21.48a1 1 0 001.1 1.48c6.05-1.52 9.28-6.47 9.28-11a1 1 0 00-2 0c0 3.53-2.5-7.05-7.82-8.35a1 1 0 00-.56 1.17z"/></svg>
                </div>
                <h1 class="text-xl font-bold">Insight Lab</h1>
            </div>
            <!-- Stages -->
            <nav id="stage-navigation">
                <!-- Stages will be dynamically generated here -->
            </nav>
            <!-- AI Helper -->
            <div class="ai-helper">
                <h3 class="text-lg font-semibold mb-2">AI Helper</h3>
                <div id="chat-box" class="chat-box p-2 bg-black bg-opacity-20 rounded-lg">
                    <div class="ai-message chat-message">
                        Welcome! I'm here to help.
                    </div>
                </div>
                <div class="relative">
                    <input type="text" id="ai-helper-input" placeholder="Ask..." class="w-full bg-black bg-opacity-20 border border-transparent focus:border-blue-400 rounded-lg p-2 pr-10 text-white placeholder-gray-400 focus:outline-none" aria-label="AI Helper Input">
                    <button id="ai-helper-send" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-300 hover:text-white" aria-label="Send Message">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </aside>
        <!-- Main Content -->
        <main id="content-area" class="content-area">
            <!-- Content for each stage will be dynamically rendered here -->
        </main>
    </div>

    <!-- STAGE 3 PLACEHOLDER -->
    <div id="stage3-template" style="display:none;">
        <div class="max-w-4xl mx-auto">
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Stage 3: Generate Insights</h2>
            <p class="text-gray-600 mb-8">Refine the AI's interpretation and develop actionable insights from your results.</p>
            <div class="bg-white p-8 rounded-xl shadow-md mb-8">
                <h3 class="text-xl font-semibold text-gray-700 mb-4">Your AI-Generated Insights</h3>
                <div id="ai-insights-display" class="prose max-w-none p-4 bg-blue-50 rounded-lg mb-6"></div>
                <h3 class="text-xl font-semibold text-gray-700 mb-4 mt-8">Refine & Annotate</h3>
                <textarea id="insights-refinement" class="w-full h-40 p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Add your own thoughts, questions, or refinements to the insights above..."></textarea>
            </div>
            <div class="text-center">
                <button id="proceed-to-strategy-btn" class="btn-primary text-lg">Next: Develop Strategy</button>
            </div>
        </div>
    </div>

    <script type="module">
        const CHUNK_SIZE = 25;
        const SECURE_API_ENDPOINT = '/.netlify/functions/gemini-proxy';
        
        const appState = {
            currentStage: 1,
            stages: [
                { id: 1, name: "Upload & Understand", completed: false },
                { id: 2, name: "Synthesize & Interpret", completed: false },
                { id: 3, name: "Generate Insights", completed: false },
                { id: 4, name: "Develop Strategy", completed: false },
                { id: 5, name: "Export Report", completed: false },
            ],
            uploadedFiles: [], // objects like { name, type, size, chunks: [], rowCount: null, analysis: null, isAnalyzing: false, analysisProgress: "", batchMetadata: null }
            userContext: "",
            synthesisResult: null,
            insights: [],
            strategy: "",
            aiHelperChatHistory: [
                { role: 'ai', text: "Welcome! I'm here to help you at any stage." }
            ],
            isLoading: false,
            privacyConsent: false,
        };

        const stageNav = document.getElementById('stage-navigation');
        const contentArea = document.getElementById('content-area');
        const chatBox = document.getElementById('chat-box');
        const aiHelperInput = document.getElementById('ai-helper-input');
        const aiHelperSend = document.getElementById('ai-helper-send');

        function renderStageNavigation() {
            stageNav.innerHTML = '';
            appState.stages.forEach(stage => {
                const stageItem = document.createElement('div');
                stageItem.className = 'stage-item';
                if (stage.id === appState.currentStage) stageItem.classList.add('active');
                if (stage.completed) stageItem.classList.add('completed');
                
                stageItem.innerHTML = `
                    <div class="stage-number">${stage.completed ? '<i class="fas fa-check"></i>' : stage.id}</div>
                    <span>${stage.name}</span>
                `;
                if (stage.completed) {
                    stageItem.onclick = () => {
                        appState.currentStage = stage.id;
                        render();
                    };
                }
                stageNav.appendChild(stageItem);
            });
        }

        function renderContentArea() {
            contentArea.innerHTML = '';
             if (appState.isLoading) {
                contentArea.innerHTML = getLoadingSpinnerHTML("Processing your data...");
                return;
            }
            switch (appState.currentStage) {
                case 1:
                    contentArea.innerHTML = getStage1HTML();
                    attachStage1Listeners();
                    break;
                case 2:
                    contentArea.innerHTML = getStage2HTML();
                    attachStage2Listeners();
                    break;
                case 3:
                    contentArea.innerHTML = getStage3HTML();
                    attachStage3Listeners();
                    break;
                default:
                    contentArea.innerHTML = `<div class="text-center py-12"><p class="text-gray-500">Stage ${appState.currentStage} content coming soon.</p></div>`;
            }
        }

        function renderAiHelperChat() {
            chatBox.innerHTML = '';
            appState.aiHelperChatHistory.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `chat-message ${msg.role === 'user' ? 'user-message' : 'ai-message'}`;
                messageDiv.textContent = msg.text;
                chatBox.appendChild(messageDiv);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function render() {
            renderStageNavigation();
            renderContentArea();
            renderAiHelperChat();
        }

        function getLoadingSpinnerHTML(text) {
             return `<div class="flex flex-col items-center justify-center h-full">
                <svg class="animate-spin -ml-1 mr-3 h-10 w-10 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="mt-4 text-lg font-medium text-gray-700">${text}</p>
            </div>`;
        }

        function getStage1HTML() {
            const filesHTML = appState.uploadedFiles.map((file, index) => `
                <div class="bg-gray-100 p-4 rounded-lg text-sm mb-4">
                    <div class="flex items-center justify-between flex-wrap gap-2">
                        <div class="flex items-center overflow-hidden mr-4">
                            <i class="fas ${file.type.startsWith('image/') ? 'fa-file-image' : 'fa-file-alt'} text-gray-500 mr-3 flex-shrink-0" aria-hidden="true"></i>
                            <span class="font-medium truncate" title="${file.name}">${file.name}</span>
                            <span class="text-gray-500 ml-2 flex-shrink-0">(${(file.size / 1024).toFixed(1)} KB)</span>
                            ${file.rowCount !== null ? `<span class="ml-4 font-semibold text-blue-600 bg-blue-100 px-2 py-1 rounded-full">${file.rowCount} rows</span>` : ''}
                        </div>
                        <div class="flex gap-2">
                             <button class="text-sm font-semibold text-red-600 hover:text-red-800 remove-file-btn" data-index="${index}" aria-label="Remove file">&times; Remove</button>
                             <button class="btn-secondary analyze-file-btn" data-index="${index}" ${file.analysis ? 'disabled' : ''} aria-label="Summarize results">
                                ${file.isAnalyzing ? `<i class="fas fa-spinner fa-spin"></i> ${file.analysisProgress}` : (file.analysis ? '✓ Summarized' : 'Summarize Results')}
                            </button>
                        </div>
                    </div>
                    ${file.analysis ? `
                        <div class="mt-4 p-4 bg-blue-50 border border-blue-200 rounded-md text-gray-800 text-sm">
                           ${file.analysis.replace(/\n/g, '<br>')}
                           ${file.batchMetadata ? `
                               <div class="mt-3 pt-3 border-t border-blue-200 text-xs text-gray-600">
                                   <strong>Batch Processing Info:</strong> ${file.batchMetadata.batchCount} batches, ${file.batchMetadata.totalRowsProcessed} rows total
                               </div>
                           ` : ''}
                        </div>
                    ` : ''}
                </div>
            `).join('');

            const canSynthesize = appState.uploadedFiles.length > 0 && appState.uploadedFiles.some(f => f.analysis);

            return `
                <div class="max-w-4xl mx-auto">
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">Stage 1: Upload & Understand</h2>
                    <p class="text-gray-600 mb-8">Provide your research context, then upload your analysis results file to begin.</p>
                    
                    <div class="privacy-banner">
                        <p><strong>Your Research Data:</strong> Uploaded files are analyzed by Gemini API. Data is not stored permanently. <a href="#" class="text-blue-600 underline">Privacy Policy</a></p>
                        <label class="flex items-center mt-2">
                            <input type="checkbox" id="privacy-consent" class="mr-2" ${appState.privacyConsent ? 'checked' : ''} aria-label="Consent to privacy policy">
                            <span class="text-xs">I understand and agree</span>
                        </label>
                    </div>

                    <div class="bg-white p-8 rounded-xl shadow-md mb-8">
                         <h3 class="text-xl font-semibold text-gray-700 mb-1">1. Research Context</h3>
                         <p class="text-sm text-gray-500 mb-4">Describe your project. What analysis have you performed? What do you want to understand?</p>
                        <textarea id="context-input" class="w-full h-32 p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="e.g., Topic modeling on Instagram posts about ChatGPT..." aria-label="Research context">${appState.userContext}</textarea>
                    </div>

                    <div class="bg-white p-8 rounded-xl shadow-md mb-8">
                        <h3 class="text-xl font-semibold text-gray-700 mb-1">2. Analysis Results File</h3>
                        <p class="text-sm text-gray-500 mb-4">Upload CSV, Excel, or image files containing your analysis output.</p>
                        
                        <div id="drop-zone" class="drop-zone mb-6">
                            <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-4" aria-hidden="true"></i>
                            <p class="text-gray-600">Drag & drop your results file here, or</p>
                            <label for="file-input" class="mt-2 inline-block bg-blue-100 text-blue-700 font-semibold px-4 py-2 rounded-lg cursor-pointer hover:bg-blue-200">
                                Browse File
                            </label>
                            <input type="file" id="file-input" class="hidden" multiple aria-label="File input">
                            <p class="text-xs text-gray-500 mt-4">Supports: CSV, XLSX, PDF, PNG, JPG</p>
                        </div>
                        <div id="file-list" class="space-y-2">${filesHTML}</div>
                        ${appState.uploadedFiles.length === 0 ? '<p class="text-center text-gray-500 py-4">Your uploaded files will appear here.</p>' : ''}
                    </div>

                    <div class="text-center">
                        <button id="synthesize-btn" class="btn-primary text-lg" ${!canSynthesize ? 'disabled' : ''} aria-label="Proceed to interpretation">Proceed to Interpretation</button>
                    </div>
                </div>
            `;
        }

        function getStage2HTML() {
             return `
                <div class="max-w-4xl mx-auto">
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">Stage 2: Synthesize & Interpret</h2>
                    <p class="text-gray-600 mb-8">Review the synthesis of your results below as a foundation for deeper insights.</p>
                    <div id="synthesis-output" class="p-8 bg-white rounded-xl shadow-md space-y-4 prose prose-sm max-w-none">
                        ${appState.synthesisResult ? appState.synthesisResult.replace(/\n/g, '<br>') : 'The interpretation of your results will appear here.'}
                    </div>
                     <div class="text-center mt-8">
                        <button id="proceed-to-insights-btn" class="btn-primary text-lg" aria-label="Proceed to insights generation">Next: Generate Insights</button>
                    </div>
                </div>
            `;
        }

        function getStage3HTML() {
            return `
                <div class="max-w-4xl mx-auto">
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">Stage 3: Generate Insights</h2>
                    <p class="text-gray-600 mb-8">Refine the AI's interpretation and develop actionable insights from your results.</p>
                    <div class="bg-white p-8 rounded-xl shadow-md mb-8">
                        <h3 class="text-xl font-semibold text-gray-700 mb-4">AI-Generated Insights</h3>
                        <div id="ai-insights-display" class="prose prose-sm max-w-none p-4 bg-blue-50 rounded-lg mb-6">
                            ${appState.insights.length > 0 ? appState.insights.map(i => `<p>${i.replace(/\n/g, '<br>')}</p>`).join('') : '<p class="text-gray-500">Click "Generate Insights" to create AI-powered insights.</p>'}
                        </div>
                        <button id="generate-insights-btn" class="btn-primary mb-6" aria-label="Generate AI insights">Generate Insights from Results</button>
                        
                        <h3 class="text-xl font-semibold text-gray-700 mb-4 mt-8">Your Refinements</h3>
                        <textarea id="insights-refinement" class="w-full h-40 p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Add your own thoughts, questions, or refinements..." aria-label="Insights refinement"></textarea>
                    </div>
                    <div class="text-center">
                        <button id="proceed-to-strategy-btn" class="btn-primary text-lg" aria-label="Proceed to strategy development">Next: Develop Strategy</button>
                    </div>
                </div>
            `;
        }

        function attachStage1Listeners() {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const contextInput = document.getElementById('context-input');
            const privacyConsent = document.getElementById('privacy-consent');
            const fileList = document.getElementById('file-list');
            const synthesizeBtn = document.getElementById('synthesize-btn');

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, preventDefaults, false));
            ['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.add('dragover'), false));
            ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.remove('dragover'), false));
            
            dropZone.addEventListener('drop', handleDrop, false);
            fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
            contextInput.addEventListener('input', (e) => { appState.userContext = e.target.value; });
            privacyConsent.addEventListener('change', (e) => { appState.privacyConsent = e.target.checked; });
            
            fileList.addEventListener('click', (e) => {
                if (e.target.closest('.remove-file-btn')) {
                    const index = parseInt(e.target.closest('.remove-file-btn').dataset.index, 10);
                    appState.uploadedFiles.splice(index, 1);
                    render();
                }
                if (e.target.closest('.analyze-file-btn')) {
                    const index = parseInt(e.target.closest('.analyze-file-btn').dataset.index, 10);
                    handleSummarizeResults(index);
                }
            });
            
            if(synthesizeBtn) {
                synthesizeBtn.addEventListener('click', handleInterpretFindings);
            }
        }

        function attachStage2Listeners() {
            const proceedBtn = document.getElementById('proceed-to-insights-btn');
            proceedBtn.addEventListener('click', () => {
                 appState.stages[1].completed = true;
                 appState.currentStage = 3;
                 render();
            });
        }

        function attachStage3Listeners() {
            const generateBtn = document.getElementById('generate-insights-btn');
            const proceedBtn = document.getElementById('proceed-to-strategy-btn');
            
            if (generateBtn) {
                generateBtn.addEventListener('click', handleGenerateInsights);
            }
            
            if (proceedBtn) {
                proceedBtn.addEventListener('click', () => {
                    appState.stages[2].completed = true;
                    appState.currentStage = 4;
                    render();
                });
            }
        }

        function attachGlobalListeners() {
             aiHelperSend.addEventListener('click', handleAiHelperSend);
             aiHelperInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); handleAiHelperSend(); }
             });
        }

        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }
        function handleDrop(e) { handleFiles(e.dataTransfer.files); }

        function robustCSVParser(textContent) {
            const lines = [];
            let currentLine = '';
            let inQuotes = false;
            const normalizedText = textContent.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            for (const char of normalizedText) {
                if (char === '"') {
                    inQuotes = !inQuotes;
                }
                if (char === '\n' && !inQuotes) {
                    lines.push(currentLine);
                    currentLine = '';
                } else {
                    currentLine += char;
                }
            }
            if (currentLine) {
                lines.push(currentLine);
            }
            return lines;
        }

        function handleFiles(files) {
            [...files].forEach(file => {
                if (file.size > 50 * 1024 * 1024) {
                    alert('File too large. Maximum 50MB.');
                    return;
                }

                const reader = new FileReader();
                
                reader.onload = (e) => {
                    const fileData = {
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        base64: '',
                        rowCount: null,
                        analysis: null,
                        isAnalyzing: false,
                        analysisProgress: "",
                        batchMetadata: null
                    };

                    if (file.type.startsWith('image/')) {
                        fileData.base64 = e.target.result.split(',')[1];
                    } else {
                        const textContent = e.target.result;
                        fileData.base64 = btoa(unescape(encodeURIComponent(textContent)));
                        if (file.type === 'text/csv' || file.name.endsWith('.csv')) {
                            const allLines = robustCSVParser(textContent);
                            const nonEmptyLines = allLines.filter(line => line.trim() !== '');
                             if (nonEmptyLines.length > 0) {
                                fileData.rowCount = nonEmptyLines.length - 1;
                            }
                        }
                    }
                    
                    appState.uploadedFiles.push(fileData);
                    render();
                };
                
                reader.onerror = () => console.error("Error reading file");
                if (file.type.startsWith('image/')) {
                    reader.readAsDataURL(file);
                } else {
                    reader.readAsText(file);
                }
            });
        }

        async function callGeminiAPI(payload) {
            const delay = Math.floor(Math.random() * 1000) + 500;
            await new Promise(resolve => setTimeout(resolve, delay));
            try {
                const response = await fetch(SECURE_API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                // Handle batch processing response format
                if (result.success && result.synthesis) {
                    return result; // Return entire batch result object
                }
                
                // Handle regular Gemini response format
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (text) return text;
                
                if (result.candidates && result.candidates[0].finishReason) {
                     throw new Error(`API call finished with reason: ${result.candidates[0].finishReason}`);
                }
                
                throw new Error("Invalid API response structure.");
            } catch (error) {
                console.error("API Call failed:", error.message);
                return `Error: ${error.message}`;
            }
        }

        async function handleSummarizeResults(index) {
            const file = appState.uploadedFiles[index];
            if (!file || file.isAnalyzing) return;

            file.isAnalyzing = true;
            file.analysisProgress = "Preparing data...";
            render();

            try {
                // === FOR CSV FILES: Use Batch Processing ===
                if (file.type === 'text/csv' || file.name.endsWith('.csv')) {
                    const csvText = atob(file.base64); // Decode base64 to text
                    
                    // Send to batch processing endpoint
                    const batchPayload = {
                        contents: [{
                            parts: [{ text: csvText }]
                        }],
                        context: appState.userContext || 'No context provided'
                    };

                    file.analysisProgress = "Analyzing batches...";
                    render();

                    const batchResponse = await callGeminiAPI(batchPayload);
                    
                    // Parse batch response
                    let batchResult;
                    try {
                        // If response is already an object, use it; if string, parse it
                        batchResult = typeof batchResponse === 'string' ? JSON.parse(batchResponse) : batchResponse;
                    } catch (e) {
                        batchResult = { synthesis: batchResponse };
                    }

                    // Store metadata for display
                    file.batchMetadata = {
                        batchCount: batchResult.batchCount || 1,
                        totalRowsProcessed: batchResult.totalRowsProcessed || file.rowCount,
                        batchSummary: batchResult.batchSummary || []
                    };

                    file.analysis = `
**📊 Batch Processing Summary:**
- Batches processed: ${batchResult.batchCount || 1}
- Total rows analyzed: ${batchResult.totalRowsProcessed || file.rowCount}

**Synthesis across all batches:**
${batchResult.synthesis || batchResponse}
                    `;
                }
                // === FOR IMAGE FILES: Use Direct Analysis ===
                else if (file.type.startsWith('image/')) {
                    const summarizationPrompt = `
                        You are an expert research assistant. Analyze this data visualization image.
                        
                        **Student's Research Context:**
                        "${appState.userContext || 'No context provided.'}"
                        
                        **Your Task:**
                        1. Identify what type of visualization this is (chart, graph, table, etc.)
                        2. Summarize the key data points and findings shown
                        3. List any metrics, percentages, or important numbers visible
                        4. Note the overall story or message of the visualization
                        
                        Be objective and factual.
                    `;
                    
                    const parts = [
                        { text: summarizationPrompt },
                        { inline_data: { mime_type: file.type, data: file.base64 } }
                    ];

                    file.analysisProgress = "Analyzing image...";
                    render();

                    const payload = { contents: [{ parts }] };
                    const result = await callGeminiAPI(payload);
                    file.analysis = result;
                }
                // === FOR OTHER FILES: Send as base64 ===
                else {
                    const summarizationPrompt = `
                        You are an expert research assistant helping a student understand their analysis results.
                        
                        **Student's Research Context:**
                        "${appState.userContext || 'No context provided.'}"
                        
                        **Your Task:**
                        1. Identify the type of analysis output this is
                        2. Summarize key findings and metrics
                        3. Be factual and objective
                    `;
                    
                    const parts = [
                        { text: summarizationPrompt },
                        { inline_data: { mime_type: file.type || 'application/octet-stream', data: file.base64 } }
                    ];

                    file.analysisProgress = "Analyzing file...";
                    render();

                    const payload = { contents: [{ parts }] };
                    const result = await callGeminiAPI(payload);
                    file.analysis = result;
                }

                file.isAnalyzing = false;
                file.analysisProgress = "";
                render();

            } catch (error) {
                console.error("Error summarizing file:", error);
                file.analysis = `❌ Error: ${error.message}. Please try again.`;
                file.isAnalyzing = false;
                file.analysisProgress = "";
                render();
            }
        }

        async function handleInterpretFindings() {
            if (!appState.privacyConsent) {
                alert('Please accept the privacy policy to continue.');
                return;
            }

            appState.isLoading = true;
            appState.stages[0].completed = true;
            appState.currentStage = 2;
            render();

            let fileSummaries = "SUMMARY OF STUDENT'S ANALYSIS RESULTS:\n\n";
            let totalBatches = 0;
            let totalRows = 0;

            appState.uploadedFiles.forEach(file => {
                if(file.analysis) {
                    fileSummaries += `--- ${file.name} ---\n`;
                    
                    if (file.batchMetadata) {
                        fileSummaries += `📊 Processed in ${file.batchMetadata.batchCount} batches (${file.batchMetadata.totalRowsProcessed} total rows)\n`;
                        totalBatches += file.batchMetadata.batchCount;
                        totalRows += file.batchMetadata.totalRowsProcessed;
                    }
                    
                    fileSummaries += `${file.analysis}\n\n`;
                }
            });

            const interpretationPrompt = `
                You are a research methodologist helping students move from results to insights.
                
                **Student's Research Context:**
                ${appState.userContext}
                
                **Factual Summary of Results:**
                (Processed across ${totalBatches} batches, ${totalRows} total rows analyzed)
                ${fileSummaries}
                
                **Your Task:**
                1. **Main Finding:** What's the central story in these results? (1-2 paragraphs)
                2. **Key Insights:** 2-3 implications of these findings (use "This suggests that..." format)
                3. **Critical Questions:** 2-3 probing questions to deepen thinking
                
                Be a Socratic guide—help them think deeper, not just summarize.
            `;
            
            const payload = { contents: [{ parts: [{ text: interpretationPrompt }] }] };
            const result = await callGeminiAPI(payload);

            appState.synthesisResult = result;
            appState.isLoading = false;
            render();
        }

        async function handleGenerateInsights() {
            appState.isLoading = true;
            render();

            const insightPrompt = `
                Based on the synthesis and interpretation you already provided:
                
                ${appState.synthesisResult}
                
                Generate 3-5 concrete, actionable insights that a student researcher could use for:
                1. Academic publication
                2. Stakeholder communication
                3. Future research direction
                
                Format each insight as: "Insight: [Statement]. Implication: [Why it matters]. Application: [How to use it]"
            `;

            const payload = { contents: [{ parts: [{ text: insightPrompt }] }] };
            const result = await callGeminiAPI(payload);

            appState.insights = [result]; // Store as array for flexibility
            appState.isLoading = false;
            render();
        }

        async function handleAiHelperSend() {
            const userText = aiHelperInput.value.trim();
            if (!userText) return;

            appState.aiHelperChatHistory.push({ role: 'user', text: userText });
            aiHelperInput.value = '';
            renderAiHelperChat();
            
            appState.aiHelperChatHistory.push({ role: 'ai', text: "Thinking..." });
            renderAiHelperChat();
            
            const prompt = `
                You are a helpful AI tutor for research interpretation. The student is on Stage ${appState.currentStage}.
                Their project: ${appState.userContext}
                Their question: "${userText}"
                
                Provide a brief, encouraging, and relevant response.
            `;
            
            const payload = { contents: [{ parts: [{ text: prompt }] }] };
            const aiResponse = await callGeminiAPI(payload);

            appState.aiHelperChatHistory.pop();
            appState.aiHelperChatHistory.push({ role: 'ai', text: aiResponse });
            renderAiHelperChat();
        }

        function init() {
            attachGlobalListeners();
            render();
        }

        init();
    </script>
</body>
